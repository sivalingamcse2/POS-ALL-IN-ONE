# Build the React client and deploy the static bundle to GitHub Pages.
# NOTE: Only the UI is served. The Express backend is NOT deployed here, so
# any action that hits /api/* (login, orders, inventory, etc.) will 404.
name: Deploy POS UI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Build client
        working-directory: client
        env:
          VITE_ROUTER_BASE: /${{ github.event.repository.name }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
      - name: SPA fallback (404.html -> index.html)
        working-directory: client
        run: cp dist/index.html dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
