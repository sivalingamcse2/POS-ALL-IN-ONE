# Render.com blueprint for SIVARA POS - single-service deployment.
#
# One web service serves BOTH the Express API (under /api) AND the built React
# client (from client/dist). Because they share one origin, the SPA calls /api
# directly and there are no CORS or GitHub Pages subpath issues.
#
# Deploy: visit https://render.com/deploy?repo=sivalingamcse2/POS-ALL-IN-ONE
# or in the Render dashboard choose New + -> Blueprint and pick this repo.
#
# NOTE: The free tier uses the local JSON storage engine at <repo root>/local_db.json.
# That file is EPHEMERAL on Render free instances - it resets when the service
# restarts or after idle sleep. For durable data, attach a PostgreSQL instance
# and set DATABASE_URL / DB_HOST.
services:
  - type: web
    name: pos-app
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm --prefix server install && npm --prefix client install && npm --prefix client run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # Freshly generated on first deploy; rotate any time from the Render dashboard
      # (rotating invalidates existing login tokens).
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      # Leave DB_HOST unset so the app uses the local JSON storage engine.
